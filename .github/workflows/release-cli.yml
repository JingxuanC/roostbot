name: release-cli
on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
          registry-url: 'https://registry.npmjs.org'
      - name: Build portable CLI release
        run: node scripts/package-cli.mjs
      - name: Upload CLI assets
        uses: actions/upload-artifact@v4
        with:
          name: roost-cli
          path: |
            dist/cli/**
            dist/roost-cli-*.tar.gz
            dist/roost-cli-*.tgz
      - name: Publish npm package
        if: startsWith(github.ref, 'refs/tags/') && env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish dist/npm/package --access public
      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/roost-cli-*.tar.gz
            dist/roost-cli-*.tgz
            dist/cli/**/checksums.txt
