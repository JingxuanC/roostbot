# Roost 同源反代示例（TLS 终止）。
#
# 两个 listener 是两份独立 origin：
#   https://roost.example.com       -> 控制面 127.0.0.1:8787
#   https://roost.example.com:8443  -> DSH 反代 127.0.0.1:4098（只服务 /w/<workspaceId>/dsh/*）
# 上游端口不同不代表浏览器 origin 不同；DSH 面板必须经第二个 listener（或第二个域名）访问。
#
# 当前实现的两个限制（详见 docs/design/deployment.md §4）：
#   1. 控制面 GET /api/config 固定返回 http://<Host>:<ROOST_DSH_PROXY_PORT>，
#      不会推导 https 或本文件的 8443；TLS 下前端 iframe 还需要代码侧支持（未实现）。
#   2. 控制面写操作的 CSRF 校验只接受回环 Origin；公网域名直接反代会返回 403
#      forbidden_origin。不要在 nginx 里改写 Origin 来绕过，这会移除 CSRF 防护。
#
# 不要添加 Access-Control-Allow-* 头：网页与控制面同源，CORS 是有意不开启的。

worker_processes auto;

events {
  worker_connections 1024;
}

http {
  server_tokens off;
  sendfile on;
  keepalive_timeout 65;
  # 产物单文件上限 50MB（见 packages/storage/src/types.ts）。
  client_max_body_size 50m;

  # SSE 用 ?access_token= 鉴权；访问日志只记 $uri（不含 query），避免把会话 token 写进日志。
  log_format roost '$remote_addr - $remote_user [$time_local] "$request_method $uri $server_protocol" $status $body_bytes_sent "$http_referer" "$http_user_agent"';
  access_log /var/log/nginx/roost-access.log roost;

  upstream roost_api {
    server 127.0.0.1:8787;
    keepalive 16;
  }

  upstream roost_dsh {
    server 127.0.0.1:4098;
    keepalive 8;
  }

  server {
    listen 443 ssl http2;
    server_name roost.example.com;

    ssl_certificate     /etc/letsencrypt/live/roost.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roost.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # 指标无鉴权：只允许本机/监控网段抓取。也可以让 Prometheus 直接抓 8787 绕过 nginx。
    location = /metrics {
      allow 127.0.0.1;
      allow 10.0.0.0/8;
      deny all;

      proxy_pass http://roost_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header Connection "";
    }

    location / {
      proxy_pass http://roost_api;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_set_header X-Accel-Buffering no;

      # SSE（/api/rooms/:id/stream）必须关闭缓冲并拉长读超时。
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }
  }

  # DSH 面板容器的独立源。只暴露 /w/，其它路径一律 404。
  server {
    listen 8443 ssl http2;
    server_name roost.example.com;

    ssl_certificate     /etc/letsencrypt/live/roost.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/roost.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location /w/ {
      proxy_pass http://roost_dsh;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Connection "";
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      return 404;
    }
  }
}
