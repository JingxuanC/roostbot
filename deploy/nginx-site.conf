# Static official site for www.roostbots.com.
# Apex roostbots.com stays the app (proxy to 127.0.0.1:8787); www is the
# marketing site. Both names are on the existing certificate.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.roostbots.com;

    ssl_certificate     /etc/nginx/ssl/roostbots.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/roostbots.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    root /opt/roost/apps/site;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript application/json image/svg+xml;

    location ~* \.(?:css|js|png|svg|webp|ico)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
